[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnbi-synthetic-benchmarks"
version = "0.1.0"
description = "Experimentos sintéticos reprodutíveis de otimização multiobjetivo com CNBI"
requires-python = "==3.10.11"
license = {text = "MIT"}

[tool.nbstripout]
keep_count = false
keep_output = false

[tool.ruff]
target-version = "py310"
line-length = 100
